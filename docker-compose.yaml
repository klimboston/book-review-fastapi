services:
  web:
    build: .

    container_name: book-review-backend

    ports:
      - "8000:8000"

    env_file:
      - .env 

    restart: always

    depends_on:
      - db

  db:
    image: postgres:17-alpine

    container_name: book_review-postgreSQL

    ports:
      - "5432:5432"

    env_file:
      - .env

    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

    