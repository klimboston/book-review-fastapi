services:
  web:
    build: .

    container_name: book-review-backend

    ports:
      - "127.0.0.1:8000:8000"



    env_file:
      - .env 

    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_HOST_ALEMBIC=${DB_HOST}
      - DB_PORT_ALEMBIC=${DB_PORT}

    command: >
      sh -c "uv run alembic upgrade head &&
             uv run uvicorn src.book_review_project.main:app --host 0.0.0.0 --port 8000"

    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy


  db:
    image: postgres:17-alpine

    container_name: book_review-postgreSQL

    ports:
      - "127.0.0.1:5433:5432"

    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

    